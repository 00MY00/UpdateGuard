name: CI

on:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  lint-unit:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['7.1', '8.2', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, zip
          tools: none
      - name: php -l (module and tests)
        run: find UpdateGuard tests -name '*.php' -not -name '*.blade.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Unit tests (no FreeScout needed)
        run: php tests/unit/run.php
      - name: shellcheck
        if: matrix.php == '8.2'
        run: |
          set -o pipefail
          # findings also as annotations (the logs of a run are not public)
          shellcheck -f gcc install.sh tools/build-release.sh tests/integration/run.sh tests/integration/fixtures.sh             | sed -E 's/^([^:]+):([0-9]+):([0-9]+): (.*)$/::error file=,line=,col=::/'

  blade:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring
          tools: composer
      - name: Blade templates compile (illuminate/view 5.5, as in FreeScout)
        run: |
          mkdir -p /tmp/blade
          # throw-away install used only to compile the templates: old Laravel 5.5 has advisories, not loaded by the module
          echo '{"config": {"policy": {"advisories": {"block": false}}, "audit": {"block-insecure": false}, "allow-plugins": false}}' > /tmp/blade/composer.json
          composer require --no-interaction --working-dir=/tmp/blade illuminate/view:5.5.*
          php tests/blade/compile.php /tmp/blade/vendor/autoload.php
      - name: JavaScript syntax
        run: for f in UpdateGuard/Public/js/*.js; do node --check "$f"; done

  # real FreeScout (Docker): Security Gate, rollback after a failed health check, blocked package, Zip Slip,
  # CLI JSON / exit codes, security reports, pages
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: FreeScout + UpdateGuard end-to-end tests (Docker)
        run: bash tests/integration/run.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint-unit, blade, integration]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches module.json
        run: |
          v="$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' UpdateGuard/module.json | head -n 1)"
          test "v${v}" = "${GITHUB_REF_NAME}"
      - name: Build release files
        run: bash tools/build-release.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/UpdateGuard.zip
            dist/install.sh
            dist/module.json
            dist/version.txt
            dist/SHA256SUMS
